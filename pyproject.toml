[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lighting-designer-workstation"
version = "2.0.0"
description = "Lighting Designer Workstation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "PySide6>=6.5,<7",
  "numpy>=1.26,<2",
  "miniaudio>=1.55,<2",
  "python-rtmidi>=1.5,<2"
]

[project.urls]
Homepage = "https://github.com/lighting-designer/workstation"
